<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="350" viewBox="0 0 1200 350" role="img" aria-labelledby="title desc">
<title id="title">Publish, receive, verify</title><desc id="desc">Publication, receiver receipt, and sender verification are distinct steps. Human approval is separate.</desc>
<rect x="1" y="1" width="1198" height="348" rx="16" fill="#ffffff" stroke="#dfe1e6"/>
<g font-family="Inter,Arial,Helvetica,sans-serif">
<text x="48" y="61" fill="#14171b" font-size="30" font-weight="700" letter-spacing="-0.6">A record for every handoff</text>
<path d="M48 91H1152" stroke="#dfe1e6"/>
<text x="48" y="150" fill="#e52349" font-size="21" font-weight="700">01</text><text x="94" y="150" fill="#14171b" font-size="27" font-weight="700">Publish</text>
<text x="48" y="197" fill="#5e626b" font-size="23">Store the update with</text><text x="48" y="231" fill="#5e626b" font-size="23">its ID and recipients.</text>
<text x="432" y="150" fill="#e52349" font-size="21" font-weight="700">02</text><text x="478" y="150" fill="#14171b" font-size="27" font-weight="700">Receive</text>
<text x="432" y="197" fill="#5e626b" font-size="23">Read the update and</text><text x="432" y="231" fill="#5e626b" font-size="23">write a matching receipt.</text>
<text x="816" y="150" fill="#e52349" font-size="21" font-weight="700">03</text><text x="862" y="150" fill="#14171b" font-size="27" font-weight="700">Verify</text>
<text x="816" y="197" fill="#5e626b" font-size="23">Check the receipt and</text><text x="816" y="231" fill="#5e626b" font-size="23">record confirmation.</text>
<path d="M397 127V240M781 127V240M48 274H1152" stroke="#dfe1e6"/>
<text x="48" y="316" fill="#5e626b" font-size="21">Delivery confirms retrieval. Human review and approval are separate.</text>
</g></svg>
