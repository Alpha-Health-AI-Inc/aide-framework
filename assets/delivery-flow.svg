<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="500" viewBox="0 0 1440 500" role="img" aria-labelledby="title desc">
<title id="title">Publish, receive, verify</title><desc id="desc">The sender publishes an update. The receiver reads and validates it, then writes a receipt. The sender checks that receipt. Human review and acceptance are separate.</desc>
<rect x="1" y="1" width="1438" height="498" rx="18" fill="#f4f8fb" stroke="#d7e3ea" stroke-width="2"/>
<text x="48" y="61" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" letter-spacing="2.5" fill="#386176">THE DELIVERY CONTRACT</text>
<text x="48" y="116" font-family="Arial,Helvetica,sans-serif" font-size="38" font-weight="700" fill="#102d40">Every handoff has a record.</text>
<g font-family="Arial,Helvetica,sans-serif">
<rect x="48" y="162" width="402" height="204" rx="12" fill="#ffffff" stroke="#d0dfe7"/>
<rect x="519" y="162" width="402" height="204" rx="12" fill="#ffffff" stroke="#d0dfe7"/>
<rect x="990" y="162" width="402" height="204" rx="12" fill="#ffffff" stroke="#9dcfbe"/>
<circle cx="89" cy="204" r="19" fill="#e6eef5"/><text x="84" y="211" font-size="20" font-weight="700" fill="#1e5572">1</text>
<circle cx="560" cy="204" r="19" fill="#e6eef5"/><text x="554" y="211" font-size="20" font-weight="700" fill="#1e5572">2</text>
<circle cx="1031" cy="204" r="19" fill="#d7f3e7"/><text x="1025" y="211" font-size="20" font-weight="700" fill="#166849">3</text>
<text x="124" y="213" font-size="26" font-weight="700" fill="#102d40">Publish</text>
<text x="595" y="213" font-size="26" font-weight="700" fill="#102d40">Receive</text>
<text x="1066" y="213" font-size="26" font-weight="700" fill="#102d40">Verify</text>
<text x="73" y="263" font-size="22" fill="#3e5869">Sender stores the update</text><text x="73" y="295" font-size="22" fill="#3e5869">with a unique ID and recipient.</text>
<text x="544" y="263" font-size="22" fill="#3e5869">Receiver reads the update</text><text x="544" y="295" font-size="22" fill="#3e5869">and writes a matching receipt.</text>
<text x="1015" y="263" font-size="22" fill="#3e5869">Sender checks the receipt</text><text x="1015" y="295" font-size="22" fill="#3e5869">and records confirmation.</text>
<text x="73" y="337" font-size="16" letter-spacing="1.3" fill="#386176">MESSAGE</text><text x="544" y="337" font-size="16" letter-spacing="1.3" fill="#386176">RECEIPT</text><text x="1015" y="337" font-size="16" letter-spacing="1.3" fill="#166849">VERIFICATION</text>
<path d="M466 261H502M492 252L502 261L492 270M937 261H973M963 252L973 261L963 270" fill="none" stroke="#7893a3" stroke-width="3"/>
<path d="M48 405H1392" stroke="#d0dfe7"/>
<text x="48" y="452" font-size="23" font-weight="700" fill="#102d40">Human review is a separate step.</text>
<text x="535" y="452" font-size="23" fill="#3e5869">A receipt confirms delivery, not approval of the work.</text>
</g></svg>
