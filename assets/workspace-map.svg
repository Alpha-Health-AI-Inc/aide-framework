<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-labelledby="title desc"><title id="title">Where everything belongs</title><desc id="desc">A proposed layout for your private operational repository.</desc>
<rect width="1000" height="540" rx="16" fill="#ffffff"/>
<g font-family="Inter,Arial,Helvetica,sans-serif">
<text x="40" y="54" font-size="30" font-weight="700" text-anchor="start" fill="#14171b">Where everything belongs</text>
<text x="40" y="88" font-size="20" font-weight="400" text-anchor="start" fill="#5e626b">A proposed layout for your private operational repository.</text>
<path d="M40 112 L960 112" fill="none" stroke="#dfe1e6" stroke-width="2"/>
<rect x="40" y="145" width="440" height="125" rx="10" fill="#f6f7f9" stroke="#dfe1e6"/>
<text x="62" y="182" font-size="24" font-weight="700" text-anchor="start" fill="#14171b">01  Get oriented</text>
<text x="62" y="217" font-size="21" font-weight="400" text-anchor="start" fill="#5e626b">START-HERE.md · context/</text>
<text x="62" y="247" font-size="21" font-weight="400" text-anchor="start" fill="#5e626b">The approved starting point</text>
<rect x="520" y="145" width="440" height="125" rx="10" fill="#f6f7f9" stroke="#dfe1e6"/>
<text x="542" y="182" font-size="24" font-weight="700" text-anchor="start" fill="#14171b">02  Know your role</text>
<text x="542" y="217" font-size="21" font-weight="400" text-anchor="start" fill="#5e626b">registry/ · roles/ · teams/</text>
<text x="542" y="247" font-size="21" font-weight="400" text-anchor="start" fill="#5e626b">Identity, scope and recipients</text>
<rect x="40" y="300" width="440" height="125" rx="10" fill="#f6f7f9" stroke="#dfe1e6"/>
<text x="62" y="337" font-size="24" font-weight="700" text-anchor="start" fill="#14171b">03  Publish selected work</text>
<text x="62" y="372" font-size="21" font-weight="400" text-anchor="start" fill="#5e626b">messages/&lt;sender-id&gt;/</text>
<text x="62" y="402" font-size="21" font-weight="400" text-anchor="start" fill="#5e626b">A new record for each update</text>
<rect x="520" y="300" width="440" height="125" rx="10" fill="#f6f7f9" stroke="#dfe1e6"/>
<text x="542" y="337" font-size="24" font-weight="700" text-anchor="start" fill="#14171b">04  Close the loop</text>
<text x="542" y="372" font-size="21" font-weight="400" text-anchor="start" fill="#5e626b">receipts/ · verifications/</text>
<text x="542" y="402" font-size="21" font-weight="400" text-anchor="start" fill="#5e626b">Evidence that the update arrived</text>
<path d="M40 479 L960 479" fill="none" stroke="#dfe1e6" stroke-width="2"/>
<text x="40" y="513" font-size="19" font-weight="400" text-anchor="start" fill="#5e626b">Folder conventions organize work. Repository permissions control access.</text>
</g></svg>
