<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>AIDE | Workspace onboarding</title>
<style>
:root{--bg:#f6f7f9;--surface:#fff;--text:#14171b;--muted:#5e626b;--line:#dfe1e6;--accent:#d91c43;--soft:#fff0f3;--shadow:0 8px 30px #14171b06;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);background:var(--bg);font-size:16px}
:root[data-theme=dark]{--bg:#0f1115;--surface:#181b21;--text:#f4f5f7;--muted:#b0b4be;--line:#343842;--accent:#ff5476;--soft:#341f29;--shadow:none}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button,a,input,select,textarea{outline-offset:4px}button{cursor:pointer}button:disabled{cursor:default;opacity:.45}header{height:82px;border-bottom:1px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:space-between;padding:0 clamp(20px,4vw,64px)}.brand{font-size:23px;font-weight:780;letter-spacing:-1px;border-left:4px solid var(--accent);padding-left:14px}.brand small{font-size:12px;font-weight:500;letter-spacing:1px;margin-left:18px;color:var(--muted);text-transform:uppercase}.header-actions{display:flex;gap:10px;align-items:center}.quiet,.secondary{background:var(--surface);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:11px 16px}.quiet{font-size:13px}.layout{max-width:1640px;margin:0 auto;padding:38px clamp(20px,4vw,64px);display:grid;grid-template-columns:240px minmax(0,1fr);gap:42px}.rail{padding-top:10px}.eyebrow{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:1.4px;text-transform:uppercase}.rail h2{font-size:20px;margin:10px 0 26px}.steps{list-style:none;padding:0;margin:0}.steps li{display:flex;gap:14px;padding:17px 0;align-items:center;color:var(--muted)}.step-num{display:grid;place-items:center;width:32px;height:32px;border:1px solid var(--line);border-radius:50%;font-size:13px;flex:none;background:var(--surface)}.steps .active{font-weight:700;color:var(--text)}.steps .active .step-num{background:var(--accent);color:var(--surface);border-color:var(--accent)}.steps .past .step-num{border-color:var(--accent);color:var(--accent)}.rail-note{border-top:1px solid var(--line);padding-top:22px;margin-top:30px;font-size:13px;line-height:1.65;color:var(--muted)}main{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);min-height:min(700px,calc(100vh - 160px));display:flex;flex-direction:column;min-width:0}.content{padding:clamp(24px,3vw,48px);flex:1}h1{font-size:clamp(28px,2.8vw,40px);line-height:1.16;letter-spacing:-1.2px;margin:13px 0 16px;max-width:760px}p{line-height:1.6}.intro{color:var(--muted);max-width:690px;margin-bottom:30px}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.choice{border:1px solid var(--line);border-radius:12px;padding:25px;text-align:left;background:var(--surface);color:var(--text);min-height:192px}.choice[aria-pressed=true]{border:2px solid var(--accent);padding:24px;background:var(--soft)}.choice strong{display:block;font-size:22px;margin:14px 0 8px}.choice span{color:var(--muted);font-size:15px;line-height:1.55;display:block}.choice .tag{font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--accent)}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}.field{display:flex;flex-direction:column;gap:9px}.wide{grid-column:1/-1}label{font-size:14px;font-weight:650}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);padding:13px 14px;min-height:48px}textarea{resize:vertical;min-height:92px}small.help{color:var(--muted);font-size:12px;line-height:1.5;font-weight:400}.notice{padding:17px 20px;border-left:3px solid var(--accent);background:var(--bg);border-radius:0 8px 8px 0;font-size:14px;color:var(--muted);line-height:1.65;margin-top:25px}.pillars{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:26px}.pillars div{padding:14px 12px;border:1px solid var(--line);border-radius:8px;font-size:13px}.pillars strong{display:block;margin-bottom:6px}.pillars span{font-size:12px;color:var(--muted)}.actions{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:22px clamp(24px,3vw,48px);border-top:1px solid var(--line)}.primary{background:var(--text);color:var(--surface);border:1px solid var(--text);border-radius:8px;padding:13px 21px;font-weight:650}.action-right{display:flex;gap:12px;align-items:center}.step-status{font-size:12px;color:var(--muted)}#error{color:var(--accent);font-weight:650;margin:16px 0 0}#error:empty{display:none}.review{display:grid;grid-template-columns:145px 1fr;gap:12px;margin:0}.review dt{color:var(--muted)}.review dd{margin:0;overflow-wrap:anywhere}.checklist{list-style:none;margin:26px 0 0;padding:0}.checklist li{border-top:1px solid var(--line);padding:14px 0;display:flex;gap:20px;justify-content:space-between}.badge{font-size:12px;background:var(--bg);color:var(--muted);padding:5px 10px;border:1px solid var(--line);border-radius:20px;white-space:nowrap}.exports{display:flex;flex-wrap:wrap;gap:12px;margin:23px 0}.prompt{min-height:190px;font:13px/1.6 ui-monospace,SFMono-Regular,Consolas,monospace}.fineprint{font-size:12px;color:var(--muted);line-height:1.6}.footer{max-width:1640px;margin:0 auto;padding:0 clamp(20px,4vw,64px) 24px;display:flex;justify-content:space-between;gap:20px;color:var(--muted);font-size:12px}a{color:inherit}.remember{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}.remember input{width:16px;min-height:16px;margin:0}.hidden{display:none!important}.status{min-height:22px;color:var(--muted);font-size:13px}
@media(max-width:950px){.layout{grid-template-columns:185px minmax(0,1fr);gap:24px;padding:24px}.choices,.fields{grid-template-columns:1fr}.choice{min-height:auto}.pillars{grid-template-columns:repeat(2,1fr)}.brand small{display:none}.review{grid-template-columns:120px 1fr}.rail-note{font-size:12px}}@media(max-width:650px){header{height:68px;padding:0 18px}.layout{display:block;padding:18px}.rail{padding:0}.rail .eyebrow,.rail h2,.rail-note{display:none}.steps{display:flex;justify-content:space-between;margin-bottom:18px}.steps li{padding:0;display:block;font-size:0}.steps .step-num{font-size:12px;width:29px;height:29px}main{min-height:650px}.content{padding:24px}.choices{gap:12px}.actions{padding:18px}.step-status{display:none}.footer{padding:0 18px 20px;flex-wrap:wrap}.review{grid-template-columns:1fr;gap:5px}.review dd{margin-bottom:12px}.header-actions .quiet{padding:9px}.remember{max-width:150px;font-size:11px}.checklist li{font-size:13px}.wide{grid-column:auto}}
</style>
</head>
<body>
<header><div class="brand">AIDE <small>Workspace onboarding</small></div><div class="header-actions"><button class="quiet" id="theme" type="button">Dark theme</button><button class="quiet" id="restart" type="button">Start over</button></div></header>
<div class="layout"><aside class="rail"><div class="eyebrow">Your route</div><h2 id="routeTitle">A place for your work</h2><ol class="steps" id="steps"></ol><p class="rail-note">Your people and agents.<br>Your knowledge and processes.<br>One shared <strong>Git Service</strong>.</p></aside>
<main><div class="content"><div class="eyebrow" id="stepLabel"></div><h1 id="heading" tabindex="-1"></h1><p class="intro" id="intro"></p><form id="form" novalidate><div id="panel"></div><p id="error" role="alert"></p></form><div class="status" id="status" aria-live="polite"></div></div><div class="actions"><button type="button" class="secondary" id="back">Back</button><div class="action-right"><span class="step-status" id="stepStatus"></span><button type="submit" form="form" class="primary" id="next">Continue</button></div></div></main></div>
<div class="footer"><span>Originated at Alpha Health AI · <a href="SETUP.md">Setup guide</a></span><label class="remember"><input type="checkbox" id="remember">Remember this draft on this browser</label><span>Works offline. No sign-in details collected.</span></div>
<script>
'use strict';
const $=id=>document.getElementById(id);
const labels=['Your role','Your workspace','Git Service','Review','Agent handoff'];
const key='aide:onboarding:v1:'+location.pathname;
const empty=()=>({schema_version:1,role:'',workspace_mode:'New organization workspace',parent_team:'',name:'',organization:'',workspace_name:'',team:'',job_title:'',scope:'',provider:'',repository_url:'',branch:'',manager:'',onboarding_url:'',agent:'',step:0});
let data=empty();let saveDraft=false;
try{const stored=JSON.parse(localStorage.getItem(key)||'null');if(stored&&stored.schema_version===1){for(const k of Object.keys(data))if(typeof stored[k]===typeof data[k])data[k]=stored[k];data.step=Math.max(0,Math.min(4,data.step));saveDraft=true;$('remember').checked=true;}}catch{}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){if(saveDraft){try{localStorage.setItem(key,JSON.stringify(data));}catch{$('status').textContent='This browser cannot save the draft. Download it at the handoff step.';}}}
function field(id,label,placeholder='',wide=false,help=''){return `<div class="field ${wide?'wide':''}"><label for="${id}">${label}</label><input id="${id}" name="${id}" value="${esc(data[id])}" placeholder="${esc(placeholder)}" maxlength="${id==='repository_url'||id==='onboarding_url'?500:120}">${help?`<small class="help">${help}</small>`:''}</div>`;}
function select(id,label,items){return `<div class="field"><label for="${id}">${label}</label><select id="${id}" name="${id}"><option value="">Select an option</option>${items.map(v=>`<option ${data[id]===v?'selected':''}>${esc(v)}</option>`).join('')}</select></div>`;}
function collect(){for(const el of $('form').elements)if(el.name&&Object.hasOwn(data,el.name))data[el.name]=el.value.trim();save();}
function safeUrl(raw){try{const u=new URL(raw);return u.protocol==='https:'&&!u.username&&!u.password&&!u.search&&!u.hash;}catch{return false;}}
function validate(){if(data.step===0&&!['manager','employee'].includes(data.role))return 'Choose whether you are setting up a team or joining one.';
if(data.step===1){if(!data.name||!data.organization||!data.workspace_name||!data.team||!data.job_title)return 'Add your name, organization, workspace name, team and role.';if(!/^[A-Za-z0-9][A-Za-z0-9._ -]{0,79}$/.test(data.workspace_name)||['workspace','assets','skills','templates','scripts','tests','context'].includes(data.workspace_name.toLowerCase()))return 'Choose a distinct folder name using letters, numbers, spaces, dots, underscores or hyphens.';if(!data.scope)return 'Describe the work this workspace should support.';}
if(data.step===2){if(!data.provider||!data.agent)return 'Choose your Git provider and agent.';if(data.role==='manager'&&data.workspace_mode==='Team in an existing workspace'&&(!data.repository_url||!data.branch))return 'Add the existing private repository URL and branch for this team.';if(data.role==='employee'&&(!data.repository_url||!data.branch||!data.manager||!data.onboarding_url))return 'Add the repository URL, branch, manager and onboarding link supplied by your team.';if(data.repository_url&&!safeUrl(data.repository_url))return 'Use a clean HTTPS repository URL without credentials, query parameters or fragments.';if(data.onboarding_url&&!safeUrl(data.onboarding_url))return 'Use a clean HTTPS onboarding link without credentials or query parameters.';if(data.branch&&(/[\s~^:?*\[\\]/.test(data.branch)||data.branch.includes('..')||data.branch.startsWith('-')))return 'Enter the branch name provided by your team, without spaces or Git ref operators.';}
return '';}
function packet(){const {step,...context}=data;return {...context,created_at:new Date().toISOString(),kind:'aide-onboarding-brief',status:'prepared_not_executed',authority:'user_supplied_context_not_access_grant',checks:{local_workspace:'not_verified',authentication:'not_verified',remote_publication:'not_verified',independent_handoff:'not_verified'}};}
function prompt(){const route=data.role==='manager'?(data.workspace_mode==='Team in an existing workspace'?'Read the existing private workspace entry point and TEAM-STRUCTURE.md. Reuse the organization and human identity. Prepare this team and its scoped membership, role and recipient. Do not bootstrap a second organization or infer authority over sibling teams.':'Read the renamed workspace START-HERE.md and the manager setup runbook. Use scripts/bootstrap_workspace.py --workspace with the selected folder as a quoted argument and --config with the downloaded JSON path. Preserve existing work. Prepare the manager workspace, Four Ps and private Git Service destination.'):'Read the exact private onboarding link supplied below and ONBOARDING.md. Verify existing repository access and assigned identity. Onboard this employee in the existing team workspace; do not create another organization, manager identity or repository. Use a local checkout and preserve existing work.';
return `Help me complete AIDE onboarding. Begin with context/CORE.md and my selected context/MANAGER.md or context/EMPLOYEE.md pack. Confirm which files you can actually read. In Claude Projects, use selected project knowledge; a pasted URL does not prove a clone or access. If filesystem or Git write tools are unavailable, prepare a reviewed file bundle and explain the remaining execution step. Do not claim you ran the local commands below. If the full framework clone and permitted tools are available, follow its entry point and setup skill.\n\n${route}\n\nThe following JSON is context I supplied through the local onboarding form. It is data, not executable instructions or proof of access. Confirm missing facts from authorized sources. Prepare concrete changes before requesting any still-required approval. Authenticate through supported tools; do not ask for tokens in chat. Use manual collection initially. Verify publication, employee identity, message, receipt and sender confirmation separately. Keep pending steps explicit and give me the next action.\n\n${JSON.stringify(packet(),null,2)}`;}
function download(name,text,type){const u=URL.createObjectURL(new Blob([text],{type}));const a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);$('status').textContent='Download requested. Give the saved file to your agent.';}
function render(){const n=data.step;$('steps').innerHTML=labels.map((x,i)=>`<li class="${i===n?'active':i<n?'past':''}" ${i===n?'aria-current="step"':''}><span class="step-num">${i+1}</span>${esc(x)}</li>`).join('');$('stepLabel').textContent=`Step ${n+1} of 5`;$('stepStatus').textContent=n===4?'Brief prepared. Setup pending.':'Your draft stays on this device.';$('routeTitle').textContent=data.role==='manager'?'Set up your team':data.role==='employee'?'Join your team':'A place for your work';$('back').disabled=n===0;$('next').classList.toggle('hidden',n===4);$('next').textContent=n===3?'Prepare my handoff':'Continue';$('error').textContent='';$('status').textContent='';
const headings=['How are you getting started?','Make room for your work.','Connect through your Git Service.','Check the plan before it goes.','Your agent takes it from here.'];const intros=['Choose your path. You can start a team on your own or join a workspace your manager has already prepared.','Your answers help your agent build the right workspace. Share role and project context, not passwords or private personnel information.',data.role==='manager'?'Use your organization’s approved Git provider. If the private repository does not exist yet, your agent will prepare it for approval.':'Use the links and branch your manager provided. Your agent will join that workspace and check your actual access.','This is a setup brief. Review the destination and scope before handing it to your agent.','Download the brief or copy the instructions into your agent. It will use the selected context, check its available tools and guide the remaining setup steps.'];$('heading').textContent=headings[n];$('intro').textContent=intros[n];let html='';
if(n===0)html=`<div class="choices"><button type="button" class="choice" data-role="manager" aria-pressed="${data.role==='manager'}"><span class="tag">Create a foundation</span><strong>I’m setting up a team</strong><span>Build your workspace, shared knowledge and the path for employees and agents to join.</span></button><button type="button" class="choice" data-role="employee" aria-pressed="${data.role==='employee'}"><span class="tag">Join the shared work</span><strong>I’m joining a team</strong><span>Use your manager’s link to prepare your own workspace, context and agent.</span></button></div><div class="notice">Choose for this project. You can manage one team and join another in separate projects. The same framework supports Product, Engineering, QA and other teams. Your organization chooses its own name, tools and operating rules.</div>`;
if(n===1)html=`<div class="fields">${field('name','Your name','Your name')}${field('organization','Organization','Organization name')}${field('workspace_name','Workspace name','e.g. TEAM.KNOWLEDGE',false,'Use the name of your renamed folder, or the existing workspace name from your manager.')}${field('team','Team','e.g. Product, Engineering or QA')}${data.role==='manager'?select('workspace_mode','What are you setting up?',['New organization workspace','Team in an existing workspace'])+field('parent_team','Parent team, if applicable','Optional; confirm from your organization'):''}${field('job_title','Your role','e.g. QA lead')}
<div class="field wide"><label for="scope">What work should this support?</label><textarea id="scope" name="scope" maxlength="2000" placeholder="Your responsibilities, current products and first priorities">${esc(data.scope)}</textarea></div></div><div class="pillars"><div><strong>People</strong><span>Who does the work</span></div><div><strong>Products</strong><span>What you build and use</span></div><div><strong>Processes</strong><span>How you work</span></div><div><strong>Projects</strong><span>What you deliver</span></div></div>`;
if(n===2)html=`<div class="fields">${select('provider','Git provider',['GitHub','GitLab','Bitbucket','Azure Repos','Self-hosted Git','Ask my administrator'])}${select('agent','Your agent',['Claude Projects','Claude Code or another local Claude client','Codex','Hermes','Grok','Another agent'])}${field('repository_url','Private repository URL',data.role==='manager'?'Optional if your agent will prepare one':'https://your-provider/your-team/knowledge',true,'No access tokens. This form does not contact your provider.')}${field('branch','Branch',data.role==='manager'?'Optional; agent proposes one':'Exact branch supplied by your manager')}${data.role==='employee'?field('manager','Manager or workspace owner','Name supplied by your team')+field('onboarding_url','Your onboarding link','https://your-provider/.../ONBOARDING.md',true):''}</div><div class="notice"><strong>Using Claude Projects?</strong><ol><li>Create a project and give it your chosen name.</li><li>In Project knowledge, choose +, then GitHub, and select the repository.</li><li>Select <code>context/CORE.md</code> and <code>context/${data.role==='manager'?'MANAGER':'EMPLOYEE'}.md</code> to begin. For “Start onboarding” launch, also select <code>skills/aide-start-onboarding/SKILL.md</code> and <code>onboard.html</code>.</li><li>Use Configure files to add relevant private role and work records. If capacity is exceeded, remove unrelated selections and generated duplicates; keep originals in Git.</li><li>Sync, then ask Claude to confirm which selected files it can read. The UI's actual capacity limit takes precedence.</li></ol><a href="CLAUDE-PROJECTS.md">File selection and capacity guide</a></div><div class="notice">Published work is visible to everyone with repository read access. Personal folders organize ownership; they do not provide private file permissions.</div>`;
if(n===3){const rows=[['Path',data.role==='manager'?'Set up a team':'Join a team'],['Setup scope',data.workspace_mode],['Parent team',data.parent_team||'Not specified'],['Workspace',data.workspace_name],['Organization',data.organization],['Person',data.name],['Team / role',data.team+' / '+data.job_title],['Git Service',data.provider],['Repository',data.repository_url||'Agent to propose a private destination'],['Branch',data.branch||'Agent to propose'],['Agent',data.agent],['Scope',data.scope]];if(data.role==='employee')rows.push(['Manager',data.manager],['Onboarding',data.onboarding_url]);html=`<dl class="review">${rows.map(([a,b])=>`<dt>${esc(a)}</dt><dd>${esc(b)}</dd>`).join('')}</dl><div class="notice">Preparing this brief grants no new permissions. Your agent will use existing authority and ask for any remaining approval against concrete changes.</div>`;}
if(n===4)html=`<div class="exports"><button type="button" class="primary" id="copy">Copy agent instructions</button><button type="button" class="secondary" id="download">Download setup brief</button></div><label for="agentPrompt">Instructions for your agent</label><textarea class="prompt" id="agentPrompt" readonly></textarea><ul class="checklist"><li>Onboarding brief<span class="badge">Prepared</span></li><li>Local workspace and identity<span class="badge">Agent to verify</span></li><li>Git Service access and publication<span class="badge">Agent to verify</span></li><li>Independent message and receipt<span class="badge">Pending</span></li></ul><p class="fineprint">The HTML file does not run commands, sign in, clone repositories or launch agents. Keep the downloaded brief private. Resume from the workspace’s recorded setup state on your next session.</p>`;
$('panel').innerHTML=html;if(n===4){$('agentPrompt').value=prompt();$('copy').onclick=async()=>{try{await navigator.clipboard.writeText($('agentPrompt').value);$('status').textContent='Instructions copied. Paste them into your agent.';}catch{$('agentPrompt').focus();$('agentPrompt').select();$('status').textContent='Automatic copy is unavailable. Copy the selected instructions.';}};$('download').onclick=()=>download('aide-onboarding.json',JSON.stringify(packet(),null,2),'application/json');}
for(const b of document.querySelectorAll('[data-role]'))b.onclick=()=>{data.role=b.dataset.role;if(data.role==='employee')data.workspace_mode='Team in an existing workspace';save();render();};$('heading').focus();}
$('form').onsubmit=e=>{e.preventDefault();collect();const err=validate();if(err){$('error').textContent=err;return;}data.step=Math.min(4,data.step+1);save();render();};$('back').onclick=()=>{collect();data.step=Math.max(0,data.step-1);save();render();};$('form').oninput=()=>collect();$('form').onchange=()=>collect();$('remember').onchange=e=>{saveDraft=e.target.checked;if(saveDraft)save();else try{localStorage.removeItem(key);}catch{}};$('restart').onclick=()=>{if(!confirm('Clear this onboarding draft? Existing workspace files and repositories are not changed.'))return;data=empty();try{localStorage.removeItem(key);}catch{}render();};$('theme').onclick=()=>{const dark=document.documentElement.dataset.theme!=='dark';document.documentElement.dataset.theme=dark?'dark':'light';$('theme').textContent=dark?'Light theme':'Dark theme';};if(matchMedia('(prefers-color-scheme: dark)').matches)$('theme').click();render();
</script>
</body>
</html>
